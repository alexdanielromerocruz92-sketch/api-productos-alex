services:
  - type: web
    name: api-productos-alex
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-productos-db
          property: connectionString
      - key: PGSSL
        value: "true"

databases:
  - name: api-productos-db
    databaseName: productos
    user: api_user
    postgresMajorVersion: "16"
    plan: free
